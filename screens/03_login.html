<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitHouse - 02 Login</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary-purple: #5E2B97;   /* Roxo principal */
      --soft-white: #FCFCFC;       /* Fundo e contraste limpo */
      --dark-graphite: #2D2D2A;    /* Textos principais e títulos */
      --accent-lilac: #CC92C2;     /* Lilás/rosa para detalhes e links */
      --rosy-granite: #84828F;     /* Cinza rosado para placeholders, bordas e ícones */
    }

        html, body {
      width: 390px;
      height: 844px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Dimensões padronizadas mobile (390 x 844 px) */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background-color: #FCFCFC;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Entalhe superior da câmera (Dynamic Island padrão ajustado) */
    .dynamic-island {
      width: 96px;
      height: 24px;
      background-color: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 50;
    }

    /* Brilho decorativo sutil com o roxo e lilás/rosa no topo */
    .purple-glow-top {
      position: absolute;
      width: 340px;
      height: 340px;
      top: -120px;
      right: -100px;
      background: radial-gradient(circle, rgba(94, 43, 151, 0.10) 0%, rgba(204, 146, 194, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #2D2D2A;
      border-radius: 100px;
      margin: 8px auto 12px auto;
      opacity: 0.25;
    }
  </style>
</head>
<body>

  <!-- FRAME MOBILE TELA DE LOGIN -->
  <div class="mobile-frame" id="splithouse-screen-02">
    
    <div class="purple-glow-top"></div>

    <!-- Barra de Status Mobile -->
    <div class="w-full pt-3 px-8 flex justify-between items-center z-40 text-xs font-semibold text-[#2D2D2A] relative">
      <span class="tracking-tight pl-1">9:41</span>
      <div class="dynamic-island"></div>
      <div class="flex items-center gap-1.5 text-[#2D2D2A] pr-1">
        <!-- Ícone Sinal -->
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9h2.5v3H1V9zm4-3h2.5v6H5V6zm4-3h2.5v9H9V3zm4-3h2.5v12H13V0z"/>
        </svg>
        <!-- Ícone Wi-Fi -->
        <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0l-1.4 1.4a3.9 3.9 0 0 0-5.6 0L3.8 6.5zM1 3.7a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0L1 3.7z"/>
        </svg>
        <!-- Ícone Bateria -->
        <div class="w-5 h-2.5 border border-[#2D2D2A] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-[#2D2D2A] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Barra de Ação Superior (Botão Voltar) -->
    <div class="w-full px-6 pt-3 pb-1 z-30 flex items-center">
      <a href="02_boas_vindas.html" class="w-10 h-10 rounded-xl bg-white border border-[#84828F]/25 flex items-center justify-center text-[#2D2D2A] shadow-xs active:scale-95 transition-transform hover:border-[#5E2B97]/40"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
    </div>

    <!-- Área Principal de Formulário -->
    <div class="flex-1 px-8 pt-2 pb-4 z-30 flex flex-col justify-center">
      
      <!-- Cabeçalho de Boas-Vindas -->
      <div class="mb-7">
        <h2 class="text-3xl font-extrabold text-[#2D2D2A] tracking-tight mb-2">
          Bem-vindo de volta
        </h2>
        <p class="text-sm font-normal text-[#84828F]">
          Entre para conferir as contas e tarefas da sua casa.
        </p>
      </div>

      <!-- Formulário de Autenticação -->
      <form class="flex flex-col gap-4">
        
        <!-- Campo: E-mail -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-[#2D2D2A]">E-mail</label>
          <div class="relative flex items-center">
            <!-- Ícone em cinza rosado -->
            <span class="absolute left-4 text-[#84828F]">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input 
              type="email" 
              value="" 
              placeholder="Digite seu e-mail" 
              class="w-full pl-11 pr-4 py-3.5 bg-white border border-[#84828F]/30 rounded-2xl text-sm font-medium text-[#2D2D2A] focus:outline-none focus:border-[#5E2B97] focus:ring-2 focus:ring-[#5E2B97]/15 shadow-2xs"
            />
          </div>
        </div>

        <!-- Campo: Senha -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-bold text-[#2D2D2A]">Senha</label>
          <div class="relative flex items-center">
            <!-- Ícone Cadeado -->
            <span class="absolute left-4 text-[#84828F]">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              value="" 
              placeholder="Digite sua senha" 
              class="w-full pl-11 pr-11 py-3.5 bg-white border border-[#84828F]/30 rounded-2xl text-sm font-medium text-[#2D2D2A] focus:outline-none focus:border-[#5E2B97] focus:ring-2 focus:ring-[#5E2B97]/15 shadow-2xs tracking-wider"
            />
            <!-- Ícone Olho (Ver senha) em rosa/lilás sutil -->
            <button type="button" class="absolute right-4 text-[#84828F] hover:text-[#5E2B97]">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Linha de Opções: Lembrar de mim & Esqueci minha senha -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 rounded border-[#84828F] text-[#5E2B97] focus:ring-[#5E2B97]/30 accent-[#5E2B97]" />
            <span class="text-xs font-medium text-[#84828F]">Lembrar de mim</span>
          </label>
          <a href="05_recuperar_senha.html" class="text-xs font-semibold text-[#CC92C2] hover:text-[#5E2B97] transition-colors">
            Esqueci a senha?
          </a>
        </div>

        <!-- Botão Principal: Entrar (Foco Absoluto no Roxo) -->
        <a href="13_painel_principal.html" class="w-full mt-3 py-4 rounded-2xl bg-[#5E2B97] hover:bg-[#4d237d] active:scale-[0.98] transition-all duration-150 text-[#FCFCFC] font-bold text-base shadow-lg shadow-[#5E2B97]/25 flex items-center justify-center gap-2 text-center decoration-none">
          <span>Entrar</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>

      </form>

      <!-- Divisor com cinza rosado -->
      <div class="relative my-6 flex items-center justify-center">
        <div class="w-full border-t border-[#84828F]/20"></div>
        <span class="absolute bg-[#FCFCFC] px-3 text-[11px] font-medium text-[#84828F] uppercase tracking-wider">
          ou acesse com
        </span>
      </div>

      <!-- Botão de Acesso Rápido Google (Componente Secundário com borda cinza) -->
      <a href="13_painel_principal.html" class="w-full py-3 rounded-2xl bg-white border border-[#84828F]/25 hover:bg-zinc-50 active:scale-[0.98] transition-all text-xs font-bold text-[#2D2D2A] flex items-center justify-center gap-2.5 shadow-2xs text-center decoration-none">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
        </svg>
        <span>Continuar com Google</span>
      </a>

    </div>

    <!-- Rodapé: Link para Cadastro -->
    <div class="w-full px-8 pb-3 z-30 flex flex-col items-center">
      <p class="text-xs text-[#84828F] font-normal mb-2">
        Ainda não tem uma conta? 
        <a href="04_cadastro.html" class="font-bold text-[#5E2B97] hover:text-[#4d237d] underline decoration-[#CC92C2] decoration-2 underline-offset-2">
          Cadastre-se
        </a>
      </p>

      <div class="home-indicator"></div>
    </div>

  </div>

  <script src="navigator.js"></script>
</body>
</html>
