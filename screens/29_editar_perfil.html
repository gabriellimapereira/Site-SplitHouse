<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitHouse - 27 Editar Perfil</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary-purple: #5E2B97;   /* Roxo principal */
      --soft-white: #FCFCFC;       /* Fundo e contraste limpo */
      --dark-graphite: #2D2D2A;    /* Textos principais e títulos */
      --accent-lilac: #CC92C2;     /* Lilás/rosa para detalhes e destaques */
      --rosy-granite: #84828F;     /* Cinza rosado para bordas e subtítulos */
    }

        html, body {
      width: 390px;
      height: 844px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Dimensões padronizadas mobile (390 x 844 px) */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background-color: #FCFCFC;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Entalhe superior da câmera */
    .dynamic-island {
      width: 96px;
      height: 24px;
      background-color: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 50;
    }

    .purple-glow-top {
      position: absolute;
      width: 340px;
      height: 340px;
      top: -120px;
      right: -100px;
      background: radial-gradient(circle, rgba(94, 43, 151, 0.10) 0%, rgba(204, 146, 194, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #2D2D2A;
      border-radius: 100px;
      margin: 6px auto 8px auto;
      opacity: 0.25;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- FRAME MOBILE EDITAR PERFIL (TELA 27) -->
  <div class="mobile-frame" id="splithouse-screen-27">
    
    <div class="purple-glow-top"></div>

    <!-- Barra de Status Mobile Padronizada -->
    <div class="w-full pt-3 px-8 flex justify-between items-center z-40 text-xs font-semibold text-[#2D2D2A] relative">
      <span class="tracking-tight pl-1">9:41</span>
      <div class="dynamic-island"></div>
      <div class="flex items-center gap-1.5 text-[#2D2D2A] pr-1">
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor"><path d="M1 9h2.5v3H1V9zm4-3h2.5v6H5V6zm4-3h2.5v9H9V3zm4-3h2.5v12H13V0z"/></svg>
        <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0l-1.4 1.4a3.9 3.9 0 0 0-5.6 0L3.8 6.5zM1 3.7a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0L1 3.7z"/></svg>
        <div class="w-5 h-2.5 border border-[#2D2D2A] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-[#2D2D2A] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Barra Superior: Voltar e Título -->
    <div class="w-full px-7 pt-7 pb-2 z-30 flex items-center justify-between">
      <a href="27_perfil_usuario.html" class="w-10 h-10 rounded-xl bg-white border border-[#84828F]/25 flex items-center justify-center text-[#2D2D2A] hover:border-[#5E2B97]/40 active:scale-95 transition-all">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>

      <h3 class="text-sm font-extrabold text-[#2D2D2A]">Editar Perfil</h3>

      <div class="w-10"></div>
    </div>

    <!-- Conteúdo Scrollável -->
    <div class="flex-1 px-7 pt-2 pb-3 z-30 overflow-y-auto no-scrollbar flex flex-col gap-3.5">

      <!-- Foto de Perfil & Avatar -->
      <div class="flex flex-col items-center gap-2 py-2">
        <div class="relative">
          <div class="w-20 h-20 rounded-3xl bg-[#5E2B97] text-[#FCFCFC] font-extrabold text-2xl flex items-center justify-center shadow-md shadow-[#5E2B97]/30 border-4 border-white">
            NO
          </div>
          <button class="absolute -bottom-1 -right-1 w-7 h-7 rounded-xl bg-white border border-[#84828F]/30 text-[#2D2D2A] flex items-center justify-center shadow-xs hover:border-[#5E2B97]/40 active:scale-95 transition-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
        </div>
        <span class="text-xs font-semibold text-[#5E2B97]">Alterar foto de exibição</span>
      </div>

      <!-- Dados Pessoais -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-4 shadow-2xs flex flex-col gap-3">
        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Nome Completo</label>
          <input 
            type="text" 
            value="Norman Osborn" 
            class="w-full text-sm font-bold text-[#2D2D2A] focus:outline-none"
          />
        </div>

        <div class="h-px bg-[#84828F]/15 w-full"></div>

        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">E-mail</label>
          <input 
            type="email" 
            value="norman.osborn@oscorp.com" 
            class="w-full text-sm font-medium text-[#2D2D2A] focus:outline-none"
          />
        </div>

        <div class="h-px bg-[#84828F]/15 w-full"></div>

        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Chave Pix (Para receber rateios)</label>
          <input 
            type="text" 
            value="norman.pix@oscorp.com" 
            placeholder="CPF, e-mail ou telefone"
            class="w-full text-sm font-bold text-[#5E2B97] focus:outline-none"
          />
        </div>
      </div>

      <!-- Segurança e Troca de Senha -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-4 shadow-2xs flex flex-col gap-3">
        <span class="text-xs font-extrabold text-[#2D2D2A]">Alterar Senha</span>
        
        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Senha Atual</label>
          <input 
            type="password" 
            value="••••••••••••" 
            class="w-full text-sm font-medium text-[#2D2D2A] focus:outline-none tracking-widest"
          />
        </div>

        <div class="h-px bg-[#84828F]/15 w-full"></div>

        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Nova Senha</label>
          <input 
            type="password" 
            placeholder="Deixe em branco para manter a atual" 
            class="w-full text-xs font-medium text-[#2D2D2A] focus:outline-none"
          />
        </div>
      </div>

    </div>

    <!-- Botão de Salvar Fixo -->
    <div class="w-full px-7 pt-2 pb-2 z-40 bg-white/90 backdrop-blur-md border-t border-[#84828F]/20">
      <a href="27_perfil_usuario.html" class="w-full py-3.5 rounded-2xl bg-[#5E2B97] text-[#FCFCFC] text-sm font-extrabold flex items-center justify-center gap-2 shadow-md shadow-[#5E2B97]/30 active:scale-[0.98] transition-transform">
        <span>Salvar alterações</span>
      </a>
      <div class="home-indicator"></div>
    </div>

  </div>

  <script src="navigator.js"></script>
</body>
</html>
