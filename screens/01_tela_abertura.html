<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitHouse - 00 Splash Screen</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary-purple: #5E2B97;   /* Roxo principal da paleta */
      --deep-purple: #3A1864;      /* Roxo profundo para extremidade do gradiente */
      --soft-white: #FCFCFC;       /* Branco da tipografia e ícone */
      --accent-lilac: #CC92C2;     /* Lilás de realce */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    html,     html, body {
      width: 390px;
      height: 844px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Dimensões mobile padrão smartphone (390 x 844 px) */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background: radial-gradient(circle at 50% 40%, #6830a6 0%, #5E2B97 45%, #421b70 85%, #341459 100%);
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 12px #222225;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Entalhe superior (Dynamic Island centralizada absolutamente) */
    .dynamic-island {
      width: 96px;
      height: 24px;
      background-color: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 50;
    }

    /* Brilho de iluminação de fundo suave */
    .ambient-glow {
      position: absolute;
      width: 380px;
      height: 380px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(204, 146, 194, 0.22) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #FCFCFC;
      border-radius: 100px;
      margin: 8px auto 12px auto;
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <!-- FRAME MOBILE SPLASH SCREEN -->
  <div class="mobile-frame" id="splithouse-screen-00" onclick="window.location.href='02_boas_vindas.html'" style="cursor: pointer;" title="Clique para iniciar">
    
    <div class="ambient-glow"></div>

    <!-- Barra de Status Mobile (Branca sobre fundo roxo) -->
    <div class="w-full pt-3 px-8 flex justify-between items-center z-40 text-xs font-semibold text-[#FCFCFC]/90 relative">
      <span class="tracking-tight pl-1">9:41</span>
      <div class="dynamic-island"></div>
      <div class="flex items-center gap-1.5 text-[#FCFCFC]/90">
        <!-- Ícone Sinal -->
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9h2.5v3H1V9zm4-3h2.5v6H5V6zm4-3h2.5v9H9V3zm4-3h2.5v12H13V0z"/>
        </svg>
        <!-- Ícone Wi-Fi -->
        <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0l-1.4 1.4a3.9 3.9 0 0 0-5.6 0L3.8 6.5zM1 3.7a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0L1 3.7z"/>
        </svg>
        <!-- Ícone Bateria -->
        <div class="w-5 h-2.5 border border-[#FCFCFC]/90 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-[#FCFCFC] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Conteúdo Central: Logotipo e Slogan -->
    <div class="flex-1 flex flex-col items-center justify-center px-8 z-30 text-center -mt-6">
      
      <!-- Emblema / Logo da Casa com Divisão -->
      <div class="w-28 h-28 rounded-3xl bg-white/10 backdrop-blur-md border border-white/25 flex items-center justify-center shadow-2xl shadow-black/25 mb-6">
        <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#FCFCFC" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M12 2v20" stroke="#CC92C2" stroke-width="2" stroke-dasharray="2 2"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>

      <!-- Nome do Aplicativo -->
      <h1 class="text-4xl font-black text-[#FCFCFC] tracking-tight leading-none mb-3">
        Split<span class="text-[#CC92C2]">House</span>
      </h1>

      <!-- Frase solicitada -->
      <p class="text-sm font-medium text-[#FCFCFC]/80 max-w-[240px] leading-relaxed">
        Seu app de divisão de despesas e tarefas!
      </p>

    </div>

    <!-- Rodapé: Indicador de Carregamento Sutil e Barra Inferior -->
    <div class="w-full pb-3 z-30 flex flex-col items-center">
      <!-- Três pontos sutis de pulso indicando transição de splash -->
      <div class="flex items-center gap-1.5 mb-6 opacity-60">
        <div class="w-1.5 h-1.5 rounded-full bg-[#FCFCFC]"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#CC92C2]"></div>
        <div class="w-1.5 h-1.5 rounded-full bg-[#FCFCFC]"></div>
      </div>
      
      <div class="home-indicator"></div>
    </div>

  </div>


  <script>
    setTimeout(function() {
      if (window.location.pathname.endsWith('01_tela_abertura.html')) {
        window.location.href = '02_boas_vindas.html';
      }
    }, 3200);
  </script>
  <script src="navigator.js"></script>
</body>
</html>
