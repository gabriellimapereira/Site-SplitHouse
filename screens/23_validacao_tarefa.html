<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitHouse - 21 Validar Tarefa</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary-purple: #5E2B97;   /* Roxo principal */
      --soft-white: #FCFCFC;       /* Fundo e contraste limpo */
      --dark-graphite: #2D2D2A;    /* Textos principais e títulos */
      --accent-lilac: #CC92C2;     /* Lilás/rosa para detalhes e destaques */
      --rosy-granite: #84828F;     /* Cinza rosado para bordas e subtítulos */
    }

        html, body {
      width: 390px;
      height: 844px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Dimensões padronizadas mobile (390 x 844 px) */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background-color: #FCFCFC;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Entalhe superior da câmera */
    .dynamic-island {
      width: 96px;
      height: 24px;
      background-color: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 50;
    }

    .purple-glow-top {
      position: absolute;
      width: 340px;
      height: 340px;
      top: -120px;
      right: -100px;
      background: radial-gradient(circle, rgba(94, 43, 151, 0.10) 0%, rgba(204, 146, 194, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #2D2D2A;
      border-radius: 100px;
      margin: 6px auto 8px auto;
      opacity: 0.25;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- FRAME MOBILE VALIDAR TAREFA POR PAR (TELA 21 - RF-08, RN-09) -->
  <div class="mobile-frame" id="splithouse-screen-21">
    
    <div class="purple-glow-top"></div>

    <!-- Barra de Status Mobile Padronizada -->
    <div class="w-full pt-3 px-8 flex justify-between items-center z-40 text-xs font-semibold text-[#2D2D2A] relative">
      <span class="tracking-tight pl-1">9:41</span>
      <div class="dynamic-island"></div>
      <div class="flex items-center gap-1.5 text-[#2D2D2A] pr-1">
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor"><path d="M1 9h2.5v3H1V9zm4-3h2.5v6H5V6zm4-3h2.5v9H9V3zm4-3h2.5v12H13V0z"/></svg>
        <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0l-1.4 1.4a3.9 3.9 0 0 0-5.6 0L3.8 6.5zM1 3.7a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0L1 3.7z"/></svg>
        <div class="w-5 h-2.5 border border-[#2D2D2A] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-[#2D2D2A] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Barra Superior: Voltar e Título -->
    <div class="w-full px-7 pt-7 pb-1 z-30 flex items-center justify-between">
      <a href="20_quadro_tarefas.html" class="w-10 h-10 rounded-xl bg-white border border-[#84828F]/25 flex items-center justify-center text-[#2D2D2A] shadow-xs active:scale-95 transition-transform hover:border-[#5E2B97]/40"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>

      <h3 class="text-sm font-extrabold text-[#2D2D2A]">Avaliação de Par</h3>

      <div class="w-10"></div>
    </div>

    <!-- Conteúdo da Validação (Roolável) -->
    <div class="flex-1 px-7 pt-3 pb-3 z-30 overflow-y-auto no-scrollbar flex flex-col gap-3.5">
      
      <!-- Cabeçalho -->
      <div>
        <span class="px-2.5 py-0.5 rounded-full bg-[#5E2B97]/10 text-[#5E2B97] text-[10px] font-extrabold">
          Validação por Pares (RN-09)
        </span>
        <h2 class="text-xl font-black text-[#2D2D2A] tracking-tight mt-1 mb-0.5">
          Aspirar tapete da sala
        </h2>
        <p class="text-xs font-normal text-[#84828F]">
          Executada por <strong>Doutor Octopus</strong> • Hoje às 11:15
        </p>
      </div>

      <!-- Card com Mockup da Foto Comprobatória Enviada -->
      <div class="w-full bg-white border border-[#84828F]/25 rounded-3xl p-3 shadow-2xs flex flex-col gap-2">
        <span class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block">Foto anexada pelo executor</span>
        
        <!-- Foto Mockup em Alta Fidelidade (Tapete Limpo) -->
        <div class="w-full h-44 rounded-2xl bg-zinc-800 relative overflow-hidden flex items-center justify-center shadow-inner">
          <div class="absolute inset-0 bg-gradient-to-tr from-zinc-900 via-zinc-800 to-zinc-700"></div>
          
          <!-- Representação gráfica de tapete e aspirador -->
          <div class="relative z-10 flex flex-col items-center text-zinc-300">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span class="text-[11px] font-bold mt-1 text-[#FCFCFC]/90">tapete_sala_concluido.jpg</span>
          </div>

          <!-- Tag de carimbo de data/hora -->
          <span class="absolute bottom-2.5 right-2.5 px-2 py-0.5 rounded-lg bg-black/60 text-[#FCFCFC] text-[9px] font-mono">
            11/09/2026 11:15
          </span>
        </div>
      </div>

      <!-- Campo Opcional de Justificativa / Comentário -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-3 shadow-2xs">
        <label class="text-[10px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">
          Observação ou justificativa (obrigatório em caso de recusa)
        </label>
        <textarea 
          placeholder="Ex: Ficou muito bom! Ou: Ainda tem sujeira perto do sofá..." 
          rows="2"
          class="w-full text-xs text-[#2D2D2A] focus:outline-none placeholder:font-normal resize-none"
        ></textarea>
      </div>

      <!-- Informação de Recompensa a ser Liberada -->
      <div class="p-3 bg-[#FAF8FC] border border-[#5E2B97]/20 rounded-2xl flex items-center justify-between text-xs">
        <span class="text-[#84828F]">Se aprovado, concede a Octopus:</span>
        <div class="flex items-center gap-1 font-extrabold text-[#5E2B97]">
          <span>+25 XP •</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#CC92C2" stroke-width="2.5" class="shrink-0"><circle cx="12" cy="12" r="9" fill="#CC92C2" fill-opacity="0.35"/><circle cx="12" cy="12" r="4.5"/></svg>
          <span>10 Moedas</span>
        </div>
      </div>

    </div>

    <!-- Botões de Ação Inferiores (Aprovar / Recusar) -->
    <div class="w-full px-7 pb-3 z-30 flex flex-col gap-2">
      
      <!-- Botão Aprovar Tarefa -->
      <button type="button" onclick="alert(\'Tarefa aprovada com sucesso! 50 XP concedidos a Doutor Octopus.\'); window.location.href=\'20_quadro_tarefas.html\';" class="w-full py-4 rounded-2xl bg-[#5E2B97] hover:bg-[#4d237d] active:scale-[0.98] transition-all text-[#FCFCFC] font-bold text-base shadow-md shadow-[#5E2B97]/25 flex items-center justify-center gap-2 cursor-pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Aprovar tarefa</span>
      </button>

      <!-- Botão Recusar Tarefa -->
      <a href="20_quadro_tarefas.html" class="w-full py-3 rounded-2xl bg-white border border-[#84828F]/30 text-[#84828F] hover:bg-zinc-50 active:scale-[0.98] transition-all font-bold text-xs flex items-center justify-center gap-2 text-center decoration-none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Recusar com justificativa</span>
      </a>

      <div class="home-indicator"></div>
    </div>

  </div>

  <script src="navigator.js"></script>
</body>
</html>
