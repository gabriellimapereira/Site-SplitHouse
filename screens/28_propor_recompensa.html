<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitHouse - 26 Propor Recompensa</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --primary-purple: #5E2B97;   /* Roxo principal */
      --soft-white: #FCFCFC;       /* Fundo e contraste limpo */
      --dark-graphite: #2D2D2A;    /* Textos principais e títulos */
      --accent-lilac: #CC92C2;     /* Lilás/rosa para detalhes e destaques */
      --rosy-granite: #84828F;     /* Cinza rosado para bordas e subtítulos */
    }

        html, body {
      width: 390px;
      height: 844px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Dimensões padronizadas mobile (390 x 844 px) */
    .mobile-frame {
      width: 390px;
      height: 844px;
      background-color: #FCFCFC;
      border-radius: 48px;
      position: relative;
      overflow: hidden;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
    }

    /* Entalhe superior da câmera */
    .dynamic-island {
      width: 96px;
      height: 24px;
      background-color: #000;
      border-radius: 20px;
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      z-index: 50;
    }

    .purple-glow-top {
      position: absolute;
      width: 340px;
      height: 340px;
      top: -120px;
      right: -100px;
      background: radial-gradient(circle, rgba(94, 43, 151, 0.10) 0%, rgba(204, 146, 194, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #2D2D2A;
      border-radius: 100px;
      margin: 6px auto 8px auto;
      opacity: 0.25;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <!-- FRAME MOBILE PROPOR RECOMPENSA (TELA 26 - RF-10) -->
  <div class="mobile-frame" id="splithouse-screen-26">
    
    <div class="purple-glow-top"></div>

    <!-- Barra de Status Mobile Padronizada -->
    <div class="w-full pt-3 px-8 flex justify-between items-center z-40 text-xs font-semibold text-[#2D2D2A] relative">
      <span class="tracking-tight pl-1">9:41</span>
      <div class="dynamic-island"></div>
      <div class="flex items-center gap-1.5 text-[#2D2D2A] pr-1">
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor"><path d="M1 9h2.5v3H1V9zm4-3h2.5v6H5V6zm4-3h2.5v9H9V3zm4-3h2.5v12H13V0z"/></svg>
        <svg width="14" height="11" viewBox="0 0 16 12" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0l-1.4 1.4a3.9 3.9 0 0 0-5.6 0L3.8 6.5zM1 3.7a9.9 9.9 0 0 1 14 0l-1.4 1.4a7.9 7.9 0 0 0-11.2 0L1 3.7z"/></svg>
        <div class="w-5 h-2.5 border border-[#2D2D2A] rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-[#2D2D2A] rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Barra Superior: Voltar e Título -->
    <div class="w-full px-7 pt-7 pb-1 z-30 flex items-center justify-between">
      <a href="25_loja_casa.html" class="w-10 h-10 rounded-xl bg-white border border-[#84828F]/25 flex items-center justify-center text-[#2D2D2A] shadow-xs active:scale-95 transition-transform">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>

      <h3 class="text-sm font-extrabold text-[#2D2D2A]">Propor Recompensa</h3>

      <div class="w-10"></div>
    </div>

    <!-- Conteúdo do Formulário (Rolável) -->
    <div class="flex-1 px-7 pt-3 pb-3 z-30 overflow-y-auto no-scrollbar flex flex-col gap-3.5">

      <!-- 1. Título e Categoria -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-4 shadow-2xs flex flex-col gap-3">
        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Título da recompensa</label>
          <input 
            type="text" 
            placeholder="Ex: Isenção de tirar o lixo" 
            value="Escolha da playlist da faxina"
            class="w-full text-base font-extrabold text-[#2D2D2A] focus:outline-none placeholder:font-normal"
          />
        </div>

        <div class="h-px bg-[#84828F]/15 w-full"></div>

        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-2">Categoria</label>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="px-3 py-1.5 rounded-full bg-[#5E2B97] text-[#FCFCFC] text-xs font-bold shadow-xs">
              Convivência
            </button>
            <button type="button" class="px-3 py-1.5 rounded-full bg-white border border-[#84828F]/30 text-[#84828F] text-xs font-semibold">
              Folga de tarefa
            </button>
            <button type="button" class="px-3 py-1.5 rounded-full bg-white border border-[#84828F]/30 text-[#84828F] text-xs font-semibold">
              Bônus coletivo
            </button>
            <button type="button" class="px-3 py-1.5 rounded-full bg-white border border-[#84828F]/30 text-[#84828F] text-xs font-semibold">
              Outros
            </button>
          </div>
        </div>
      </div>

      <!-- 2. Preço em Moedas e Vagas -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-4 shadow-2xs flex flex-col gap-3">
        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Custo (Moedas da Casa)</label>
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg bg-[#CC92C2]/20 flex items-center justify-center shrink-0">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#CC92C2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" fill="#CC92C2" fill-opacity="0.35"/>
                <circle cx="12" cy="12" r="4.5"/>
              </svg>
            </div>
            <input 
              type="number" 
              placeholder="75" 
              value="75"
              class="w-full text-base font-extrabold text-[#2D2D2A] focus:outline-none placeholder:font-normal"
            />
          </div>
        </div>

        <div class="h-px bg-[#84828F]/15 w-full"></div>

        <div>
          <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block mb-1">Limite mensal</label>
          <input 
            type="text" 
            placeholder="Ex: 2 resgates por mês" 
            value="3 resgates por ciclo"
            class="w-full text-sm font-bold text-[#2D2D2A] focus:outline-none placeholder:font-normal"
          />
        </div>
      </div>

      <!-- 3. Regras e Descrição -->
      <div class="bg-white border border-[#84828F]/20 rounded-2xl p-4 shadow-2xs flex flex-col gap-2">
        <label class="text-[11px] font-bold text-[#84828F] uppercase tracking-wider block">Descrição e Regras de Uso</label>
        <textarea 
          rows="3" 
          placeholder="Explique os termos combinados para o benefício..."
          class="w-full text-xs font-medium text-[#2D2D2A] focus:outline-none resize-none leading-relaxed"
        >Direito exclusivo de conectar o celular na caixa de som durante as 2 horas da faxina coletiva de sábado, sem vetos do grupo.</textarea>
      </div>

      <!-- 4. Regra de Convivência -->
      <div class="bg-gray-50 border border-[#84828F]/20 rounded-2xl p-3 flex items-start gap-2.5">
        <svg class="text-[#5E2B97] mt-0.5 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <p class="text-[11px] text-[#84828F] leading-relaxed">
          <strong class="text-[#2D2D2A]">Aprovação coletiva:</strong> Recompensas propostas ficam ativas na loja após validação pelos moradores da república.
        </p>
      </div>

    </div>

    <!-- Botão de Ação Inferior Fixo -->
    <div class="w-full px-7 pt-2 pb-2 z-40 bg-white/90 backdrop-blur-md border-t border-[#84828F]/20">
      <a href="25_loja_casa.html" class="w-full py-3.5 rounded-2xl bg-[#5E2B97] text-[#FCFCFC] text-sm font-extrabold flex items-center justify-center gap-2 shadow-md shadow-[#5E2B97]/30 active:scale-[0.98] transition-transform">
        <span>Publicar recompensa</span>
      </a>
      <div class="home-indicator"></div>
    </div>

  </div>

  <script src="navigator.js"></script>
</body>
</html>
